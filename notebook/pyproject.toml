[project]
name = "genai-intro-notebook"
version = "0.1.0"
description = "querychat over the NYC taxi table: system prompt, tool calls, structured output, RAG and cost per question, for the CPSC 436C generative-AI lecture"
requires-python = ">=3.12"
dependencies = [
    "chatlas>=0.23.0",
    "querychat>=0.9.0",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow",
    "pydantic>=2.13.5",
    "openai>=3.26.0",
    "numpy>=2.5.3",
    "scikit-learn",
    "ipykernel",
    "nbclient",
    "nbformat",
    "sqlglot>=30.27.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
